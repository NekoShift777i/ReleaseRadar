check_interval_seconds: 3600
software:
  - id: xray
    name: Xray-core
    provider: github
    repository: XTLS/Xray-core
    channel: prerelease
    current_version: test-version
    enabled: true
  - id: crafty4
    name: Crafty Controller 4
    provider: gitlab
    repository: crafty-controller/crafty-4
    channel: stable
    current_version: 4.10.8
    enabled: true
  - id: 3x-ui
    name: 3x-ui
    provider: github
    repository: MHSanaei/3x-ui
    channel: stable
    current_version: v3.8.5
    enabled: true
  - id: sing-box
    name: sing-box
    provider: github
    repository: SagerNet/sing-box
    channel: stable
    current_version: 1.14.2
    enabled: true
  - id: nextcloud-server
    name: Nextcloud Server
    provider: github
    repository: nextcloud/server
    channel: stable
    current_version: v35.0.1
    enabled: true
  - id: home-assistant
    name: Home Assitant
    provider: github
    repository: home-assistant/core
    channel: stable
    current_version: 2026.9.4
    enabled: true
  - id: uptime-kuma
    name: Uptime Kuma
    provider: github
    repository: louislam/uptime-kuma
    channel: stable
    current_version: 2.5.5
    enabled: true
  - id: nekobox
    name: Nekobox
    provider: github
    repository: qr243vbi/nekobox
    channel: stable
    current_version: 5.11.28.3
    enabled: true
  - id: zapret-discord-youtube
    name: Zapret
    provider: github
    repository: Flowseal/zapret-discord-youtube
    channel: stable
    current_version: 1.10.3
    enabled: true
  - id: tg-ws-proxy
    name: TgWsProxy
    provider: github
    repository: Flowseal/tg-ws-proxy
    channel: stable
    current_version: TG WS Proxy v1.10.4
    enabled: true
  - id: morphe-pathes
    name: Morphe Patches
    provider: github
    repository: MorpheApp/morphe-pathes
    channel: prerelease
    current_version: v1.45.0
    enabled: true
  - id: morphe-manager
    name: Morphe Manager for Android
    provider: github
    repository: MorpheApp/morphe-manager
    channel: prerelease
    enabled: true
